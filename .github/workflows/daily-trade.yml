# Runs the moving-average crossover bot every weekday at the 9:30 AM ET open.
#
# GitHub schedules are in UTC and don't follow daylight saving time, so this
# is scheduled at both 13:30 UTC (9:30 EDT, summer) and 14:30 UTC (9:30 EST,
# winter). The "Check it's market-open time" step skips whichever of the two
# isn't 9:30 AM in New York that day.
#
# Each run's log is saved to the `bot-logs` branch as logs/YYYY-MM-DD.log and
# shown on the run's summary page under the Actions tab.

name: Daily trade

on:
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: daily-trade
  cancel-in-progress: false

permissions:
  contents: write # needed to save logs to the bot-logs branch

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check it's market-open time
        id: gate
        run: |
          now=$(TZ=America/New_York date +%H%M)
          echo "New York time: $now"
          # GitHub can start scheduled runs late, so allow 9:00-10:29 AM ET.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$now" -ge 0900 ] && [ "$now" -lt 1030 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 9:30 AM in New York right now (daylight-saving duplicate). Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run trading bot
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python bot.py --trading-days-only

      - name: Show log on the run summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          {
            echo "## Trading bot log — $(TZ=America/New_York date '+%a %Y-%m-%d %H:%M %Z')"
            echo '```'
            cat logs/bot.log 2>/dev/null || echo "(no log written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save log to the bot-logs branch
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          day=$(TZ=America/New_York date +%Y-%m-%d)
          git config --global user.name "trading-bot"
          git config --global user.email "trading-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bot-logs >/dev/null; then
            git fetch --depth 1 origin bot-logs
            git worktree add logbook FETCH_HEAD
            git -C logbook checkout -B bot-logs
          else
            git worktree add --orphan -b bot-logs logbook
          fi
          mkdir -p logbook/logs
          {
            echo "===== run ${{ github.run_id }} ($(TZ=America/New_York date '+%H:%M %Z')) ====="
            cat logs/bot.log 2>/dev/null || echo "(no log written; see the Actions run for errors)"
          } >> "logbook/logs/$day.log"
          git -C logbook add logs
          git -C logbook commit -m "Bot log for $day"
          git -C logbook push origin bot-logs
